<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panel de precios · Tienda Cuis</title>
<style>
  :root {
    --bg: #FAF8F5;
    --texto: #1A1A1A;
    --texto-suave: #6b6b6b;
    --borde: #E8E4DB;
    --naranja: #E8673A;
    --naranja-oscuro: #C4522C;
    --navy: #2D2B45;
    --verde: #9BA88D;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--texto);
  }
  header {
    background: var(--navy);
    color: #fff;
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 {
    font-size: 15px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 0;
    font-weight: 600;
  }
  header button {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    padding: 6px 12px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
  }
  #login-view {
    max-width: 340px;
    margin: 100px auto;
    background: #fff;
    padding: 32px;
    border-radius: 6px;
    border: 1px solid var(--borde);
  }
  #login-view h2 {
    margin-top: 0;
    font-size: 18px;
  }
  #login-view input {
    width: 100%;
    padding: 10px;
    margin-bottom: 12px;
    border: 1px solid var(--borde);
    border-radius: 4px;
    font-size: 14px;
  }
  #login-view button {
    width: 100%;
    padding: 10px;
    background: var(--naranja);
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  #login-error {
    color: #c0392b;
    font-size: 12px;
    margin-bottom: 8px;
    min-height: 16px;
  }
  main {
    padding: 20px 24px 60px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 16px;
  }
  .toolbar input[type=text] {
    flex: 1;
    min-width: 200px;
    padding: 8px 10px;
    border: 1px solid var(--borde);
    border-radius: 4px;
    font-size: 13px;
  }
  .toolbar select {
    padding: 8px 10px;
    border: 1px solid var(--borde);
    border-radius: 4px;
    font-size: 13px;
    background: #fff;
  }
  .btn-pdf {
    background: var(--navy);
    color: #fff;
    border: none;
    padding: 9px 16px;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
    white-space: nowrap;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border: 1px solid var(--borde);
    border-radius: 6px;
    overflow: hidden;
  }
  th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--texto-suave);
    padding: 10px 12px;
    border-bottom: 1px solid var(--borde);
    background: #F4F1EC;
  }
  td {
    padding: 8px 12px;
    border-bottom: 1px solid var(--borde);
    font-size: 13px;
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }
  img.thumb {
    width: 40px;
    height: 40px;
    object-fit: contain;
    border: 1px solid var(--borde);
    border-radius: 4px;
    background: #fff;
  }
  td input[type=number] {
    width: 90px;
    padding: 6px 8px;
    border: 1px solid var(--borde);
    border-radius: 4px;
    font-size: 13px;
  }
  td input[type=text].img-url {
    width: 150px;
    padding: 6px 8px;
    border: 1px solid var(--borde);
    border-radius: 4px;
    font-size: 11px;
    color: var(--texto-suave);
  }
  td input[type=text].nombre-input {
    width: 160px;
    padding: 6px 8px;
    border: 1px solid var(--borde);
    border-radius: 4px;
    font-size: 13px;
  }
  td input[type=text].categoria-input {
    width: 100px;
    padding: 6px 8px;
    border: 1px solid var(--borde);
    border-radius: 4px;
    font-size: 12px;
    color: var(--verde);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .img-cell {
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-items: flex-start;
  }
  .categoria-tag {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--verde);
    font-weight: 600;
  }
  .save-btn {
    background: var(--naranja);
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    font-weight: 600;
  }
  .save-btn:disabled {
    background: var(--borde);
    color: var(--texto-suave);
    cursor: default;
  }
  .save-btn.ok { background: #6b9b6f; }
  .switch {
    position: relative;
    display: inline-block;
    width: 36px;
    height: 20px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; inset: 0;
    background-color: var(--borde);
    transition: .2s;
    border-radius: 20px;
  }
  .slider:before {
    position: absolute; content: "";
    height: 14px; width: 14px; left: 3px; bottom: 3px;
    background-color: white;
    transition: .2s;
    border-radius: 50%;
  }
  input:checked + .slider { background-color: var(--verde); }
  input:checked + .slider:before { transform: translateX(16px); }
  #estado {
    font-size: 12px;
    color: var(--texto-suave);
    margin-bottom: 10px;
  }
  .hidden { display: none !important; }
  #form-nuevo {
    background: #fff;
    border: 1px solid var(--borde);
    border-radius: 6px;
    padding: 16px;
    margin-bottom: 16px;
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 2fr auto;
    gap: 10px;
    align-items: end;
  }
  #form-nuevo label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--texto-suave);
    display: block;
    margin-bottom: 4px;
  }
  #form-nuevo input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--borde);
    border-radius: 4px;
    font-size: 13px;
  }
  .btn-toggle-nuevo {
    background: var(--verde);
    color: #fff;
    border: none;
    padding: 9px 16px;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
    white-space: nowrap;
  }
  .btn-agregar {
    background: var(--naranja);
    color: #fff;
    border: none;
    padding: 9px 14px;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
    height: 37px;
  }
  .drag-handle {
    cursor: grab;
    color: var(--texto-suave);
    font-size: 16px;
    user-select: none;
    padding: 0 6px;
  }
  .drag-handle:active { cursor: grabbing; }
  tr.arrastrando { opacity: 0.4; }
  tr.zona-drop { border-top: 2px solid var(--naranja); }
  .btn-guardar-orden {
    background: var(--naranja-oscuro);
    color: #fff;
    border: none;
    padding: 9px 16px;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
    white-space: nowrap;
  }
  #aviso-orden {
    font-size: 12px;
    color: var(--texto-suave);
    background: #F4F1EC;
    border: 1px solid var(--borde);
    border-radius: 4px;
    padding: 8px 12px;
    margin-bottom: 12px;
  }
  #seccion-portada {
    background: #fff;
    border: 1px solid var(--borde);
    border-radius: 6px;
    padding: 16px;
    margin-bottom: 16px;
  }
  #seccion-portada label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--texto-suave);
    display: block;
    margin-bottom: 6px;
  }
  #seccion-portada textarea {
    width: 100%;
    min-height: 60px;
    padding: 8px 10px;
    border: 1px solid var(--borde);
    border-radius: 4px;
    font-size: 13px;
    font-family: inherit;
    resize: vertical;
    margin-bottom: 8px;
  }
  .btn-guardar-portada {
    background: var(--navy);
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    font-weight: 600;
  }
</style>
</head>
<body>

<div id="login-view">
  <h2>Panel Tienda Cuis</h2>
  <div id="login-error"></div>
  <input type="text" id="usuario" placeholder="Usuario" autocomplete="username" />
  <input type="password" id="clave" placeholder="Contraseña" autocomplete="current-password" />
  <button onclick="login()">Ingresar</button>
</div>

<div id="app-view" class="hidden">
  <header>
    <h1>Panel de precios · Tienda Cuis</h1>
    <button onclick="logout()">Salir</button>
  </header>
  <main>
    <div class="toolbar">
      <input type="text" id="buscador" placeholder="Buscar producto..." oninput="render()" />
      <select id="filtroCategoria" onchange="render()">
        <option value="todos">Todas las categorías</option>
      </select>
      <button class="btn-toggle-nuevo" onclick="toggleFormNuevo()">+ Nuevo producto</button>
      <button class="btn-guardar-orden hidden" id="btn-guardar-orden" onclick="guardarOrden()">💾 Guardar orden</button>
      <button class="btn-pdf" onclick="toggleSeccionPortada()">📝 Texto de portada</button>
      <button class="btn-pdf" onclick="descargarPDF()">⬇ Descargar catálogo PDF</button>
    </div>

    <div id="seccion-portada" class="hidden">
      <label>Texto libre para la portada del catálogo (subtítulo, promo, lo que quieras agregar)</label>
      <textarea id="texto-portada" placeholder="Ej: Envíos a todo el país. Pedido mínimo $50.000. Precios sujetos a modificación sin previo aviso."></textarea>
      <button class="btn-guardar-portada" onclick="guardarPortada()">Guardar texto de portada</button>
    </div>

    <div id="form-nuevo" class="hidden">
      <div>
        <label>Nombre</label>
        <input type="text" id="nuevo-nombre" placeholder="Ej: Bombilla Pico de Loro" />
      </div>
      <div>
        <label>Categoría</label>
        <input type="text" id="nuevo-categoria" list="lista-categorias" placeholder="bombillas" />
        <datalist id="lista-categorias"></datalist>
      </div>
      <div>
        <label>Precio</label>
        <input type="number" id="nuevo-precio" placeholder="0" />
      </div>
      <div>
        <label>Imagen (URL)</label>
        <input type="text" id="nuevo-imagen" placeholder="https://..." />
      </div>
      <button class="btn-agregar" onclick="agregarProducto()">Agregar</button>
    </div>

    <div id="aviso-orden" class="hidden">Limpiá la búsqueda y elegí "Todas las categorías" para poder arrastrar y reordenar productos.</div>
    <div id="estado">Cargando productos...</div>
    <table>
      <thead>
        <tr>
          <th></th>
          <th></th>
          <th>Producto</th>
          <th>Categoría</th>
          <th>Precio</th>
          <th>Imagen (URL)</th>
          <th>Activo</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </main>
</div>

<script>
let productos = [];

async function checkSession() {
  const r = await fetch('/api/session');
  const data = await r.json();
  if (data.logueado) {
    mostrarApp();
  }
}

async function login() {
  const usuario = document.getElementById('usuario').value;
  const clave = document.getElementById('clave').value;
  const errorEl = document.getElementById('login-error');
  errorEl.textContent = '';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ usuario, clave })
    });
    if (!r.ok) {
      const data = await r.json();
      errorEl.textContent = data.error || 'Error al ingresar';
      return;
    }
    mostrarApp();
  } catch (err) {
    errorEl.textContent = 'No se pudo conectar con el servidor';
  }
}

async function logout() {
  await fetch('/api/logout', { method: 'POST' });
  document.getElementById('app-view').classList.add('hidden');
  document.getElementById('login-view').classList.remove('hidden');
}

function mostrarApp() {
  document.getElementById('login-view').classList.add('hidden');
  document.getElementById('app-view').classList.remove('hidden');
  cargarProductos();
  cargarPortada();
}

async function cargarPortada() {
  try {
    const r = await fetch('/api/portada');
    if (!r.ok) return;
    const data = await r.json();
    document.getElementById('texto-portada').value = data.texto || '';
  } catch (err) {
    // si falla, se puede seguir usando el panel sin este dato
  }
}

function toggleSeccionPortada() {
  document.getElementById('seccion-portada').classList.toggle('hidden');
}

async function guardarPortada() {
  const btn = document.querySelector('.btn-guardar-portada');
  const texto = document.getElementById('texto-portada').value;
  btn.disabled = true;
  btn.textContent = 'Guardando...';
  try {
    const r = await fetch('/api/portada', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ texto })
    });
    if (!r.ok) throw new Error('Error al guardar');
    btn.textContent = '✓ Guardado';
    setTimeout(() => { btn.textContent = 'Guardar texto de portada'; btn.disabled = false; }, 1500);
  } catch (err) {
    btn.textContent = 'Error al guardar';
    setTimeout(() => { btn.textContent = 'Guardar texto de portada'; btn.disabled = false; }, 2000);
  }
}

async function cargarProductos() {
  const estado = document.getElementById('estado');
  estado.textContent = 'Cargando productos...';
  try {
    const r = await fetch('/api/productos');
    if (r.status === 401) { logout(); return; }
    productos = await r.json();
    productos.sort((a, b) => a.rowNumber - b.rowNumber);
    estado.textContent = productos.length + ' productos cargados';
    llenarFiltroCategorias();
    render();
  } catch (err) {
    estado.textContent = 'Error al cargar productos: ' + err.message;
  }
}

function llenarFiltroCategorias() {
  const select = document.getElementById('filtroCategoria');
  const categorias = [...new Set(productos.map(p => p.categoria).filter(Boolean))].sort();
  select.innerHTML = '<option value="todos">Todas las categorías</option>' +
    categorias.map(c => `<option value="${c}">${c}</option>`).join('');
  document.getElementById('lista-categorias').innerHTML =
    categorias.map(c => `<option value="${c}"></option>`).join('');
}

function toggleFormNuevo() {
  document.getElementById('form-nuevo').classList.toggle('hidden');
}

async function agregarProducto() {
  const nombre = document.getElementById('nuevo-nombre').value.trim();
  const categoria = document.getElementById('nuevo-categoria').value.trim();
  const precio = Number(document.getElementById('nuevo-precio').value) || 0;
  const imagen = document.getElementById('nuevo-imagen').value.trim();

  if (!nombre) {
    alert('El nombre es obligatorio');
    return;
  }

  try {
    const r = await fetch('/api/productos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nombre, categoria, precio, imagen, activo: true })
    });
    if (!r.ok) {
      const data = await r.json();
      alert(data.error || 'Error al agregar el producto');
      return;
    }
    document.getElementById('nuevo-nombre').value = '';
    document.getElementById('nuevo-categoria').value = '';
    document.getElementById('nuevo-precio').value = '';
    document.getElementById('nuevo-imagen').value = '';
    document.getElementById('form-nuevo').classList.add('hidden');
    await cargarProductos();
  } catch (err) {
    alert('No se pudo conectar con el servidor');
  }
}

let ordenSucio = false;
let draggedRowNumber = null;

function dragStart(e, rowNumber) {
  draggedRowNumber = rowNumber;
  e.dataTransfer.effectAllowed = 'move';
  e.target.closest('tr').classList.add('arrastrando');
}

function dragEnd(e) {
  e.target.closest('tr').classList.remove('arrastrando');
  document.querySelectorAll('tr.zona-drop').forEach(tr => tr.classList.remove('zona-drop'));
}

function dragOver(e) {
  e.preventDefault();
  const tr = e.target.closest('tr');
  if (!tr) return;
  document.querySelectorAll('tr.zona-drop').forEach(t => t.classList.remove('zona-drop'));
  tr.classList.add('zona-drop');
}

function drop(e, targetRowNumber) {
  e.preventDefault();
  document.querySelectorAll('tr.zona-drop').forEach(tr => tr.classList.remove('zona-drop'));
  if (draggedRowNumber === null || draggedRowNumber === targetRowNumber) return;

  const fromIdx = productos.findIndex(p => p.rowNumber === draggedRowNumber);
  const toIdx = productos.findIndex(p => p.rowNumber === targetRowNumber);
  if (fromIdx === -1 || toIdx === -1) return;

  const [item] = productos.splice(fromIdx, 1);
  productos.splice(toIdx, 0, item);
  draggedRowNumber = null;
  ordenSucio = true;
  document.getElementById('btn-guardar-orden').classList.remove('hidden');
  render();
}

async function guardarOrden() {
  const btn = document.getElementById('btn-guardar-orden');
  btn.disabled = true;
  btn.textContent = 'Guardando orden...';
  try {
    const ids = productos.map(p => p.id);
    const r = await fetch('/api/productos/orden', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids })
    });
    if (!r.ok) throw new Error('Error al guardar el orden');
    ordenSucio = false;
    btn.classList.add('hidden');
    await cargarProductos();
  } catch (err) {
    alert('No se pudo guardar el orden');
  } finally {
    btn.disabled = false;
    btn.textContent = '💾 Guardar orden';
  }
}

function render() {
  const busqueda = document.getElementById('buscador').value.toLowerCase();
  const categoria = document.getElementById('filtroCategoria').value;
  const tbody = document.getElementById('tbody');
  const avisoOrden = document.getElementById('aviso-orden');

  const sinFiltros = busqueda === '' && categoria === 'todos';
  avisoOrden.classList.toggle('hidden', sinFiltros);

  const filtrados = productos.filter(p => {
    const matchNombre = p.nombre.toLowerCase().includes(busqueda);
    const matchCat = categoria === 'todos' || p.categoria === categoria;
    return matchNombre && matchCat;
  });

  tbody.innerHTML = filtrados.map((p) => {
    const manija = sinFiltros
      ? `<span class="drag-handle" draggable="true" ondragstart="dragStart(event, ${p.rowNumber})" ondragend="dragEnd(event)">⠿</span>`
      : '';

    const atributosDrop = sinFiltros
      ? `ondragover="dragOver(event)" ondrop="drop(event, ${p.rowNumber})"`
      : '';

    return `
    <tr data-row="${p.rowNumber}" ${atributosDrop}>
      <td>${manija}</td>
      <td><img class="thumb" data-preview src="${p.imagen || ''}" onerror="this.style.visibility='hidden'" /></td>
      <td><input type="text" class="nombre-input" value="${p.nombre}" data-field="nombre" /></td>
      <td><input type="text" class="categoria-input" list="lista-categorias" value="${p.categoria}" data-field="categoria" /></td>
      <td><input type="number" step="1" value="${p.precio}" data-field="precio" /></td>
      <td>
        <div class="img-cell">
          <input type="text" class="img-url" data-field="imagen" value="${p.imagen || ''}" placeholder="URL de la imagen" oninput="actualizarPreview(this)" />
        </div>
      </td>
      <td>
        <label class="switch">
          <input type="checkbox" data-field="activo" ${p.activo ? 'checked' : ''} />
          <span class="slider"></span>
        </label>
      </td>
      <td><button class="save-btn" onclick="guardar(${p.rowNumber}, this)">Guardar</button></td>
    </tr>
  `;
  }).join('');
}

function actualizarPreview(input) {
  const tr = input.closest('tr');
  tr.querySelector('[data-preview]').src = input.value;
}

async function guardar(rowNumber, btn) {
  const tr = btn.closest('tr');
  const nombre = tr.querySelector('[data-field="nombre"]').value.trim();
  const categoria = tr.querySelector('[data-field="categoria"]').value.trim();
  const precio = Number(tr.querySelector('[data-field="precio"]').value);
  const activo = tr.querySelector('[data-field="activo"]').checked;
  const imagen = tr.querySelector('[data-field="imagen"]').value.trim();

  if (!nombre) {
    alert('El nombre no puede quedar vacío');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Guardando...';

  try {
    const r = await fetch('/api/productos/' + rowNumber, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nombre, categoria, precio, activo, imagen })
    });
    if (!r.ok) throw new Error('Error al guardar');

    const p = productos.find(p => p.rowNumber === rowNumber);
    if (p) { p.nombre = nombre; p.categoria = categoria; p.precio = precio; p.activo = activo; p.imagen = imagen; }

    btn.textContent = '✓ Guardado';
    btn.classList.add('ok');
    setTimeout(() => {
      btn.textContent = 'Guardar';
      btn.classList.remove('ok');
      btn.disabled = false;
    }, 1500);
  } catch (err) {
    btn.textContent = 'Error';
    btn.disabled = false;
    setTimeout(() => { btn.textContent = 'Guardar'; }, 2000);
  }
}

function descargarPDF() {
  window.open('/api/catalogo.pdf', '_blank');
}

checkSession();
</script>
</body>
</html>
